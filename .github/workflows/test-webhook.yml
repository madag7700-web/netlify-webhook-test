name: Test Netlify Webhook

on:
  workflow_dispatch:

jobs:
  test-webhook:
    runs-on: ubuntu-latest

    steps:
      - name: POST JSON to Netlify Function
        run: |
          curl -4 -v \
            --http1.1 \
            --connect-timeout 20 \
            --max-time 60 \
            -X POST \
            "URL_NETLIFY_KAMU/webhook-test" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHubActions-Netlify-Test/1.0" \
            --data '{"test":true,"source":"github-actions","message":"EXTERNAL_SERVER_TEST"}'
